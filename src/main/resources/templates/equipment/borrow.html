<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>EquipIT - Borrow</title>
</head>
<body>
<h1>Borrow Equipment</h1>
<div th:if="${equipment}">
    <p th:text="|${equipment.name} - ${equipment.category}|"></p>
    <p th:if="${equipment.available}">Status: available</p>
    <p th:unless="${equipment.available}">Status: already borrowed</p>
    <form th:action="@{/preview/equipment/borrow/{id}(id=${equipment.id})}" method="post" th:object="${borrowRequest}">
        <label>First name: <input type="text" name="firstName" th:field="*{firstName}"/></label><br/>
        <label>Last name: <input type="text" name="lastName" th:field="*{lastName}"/></label><br/>
        <button type="submit">Borrow</button>
    </form>
</div>
<a th:href="@{/preview/equipment}">Back to list</a>
</body>
</html>
