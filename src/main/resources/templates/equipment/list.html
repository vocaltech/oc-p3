<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>EquipIT - Equipment</title>
</head>
<body>
<h1 th:text="${title}">Equipment</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Available</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${equipment}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.name}"></td>
        <td th:text="${e.category}"></td>
        <td th:text="${e.available ? 'Yes' : 'No'}"></td>
        <td>
            <a th:href="@{/preview/equipment/borrow/{id}(id=${e.id})}" th:if="${e.available}">Borrow</a>
            <a th:href="@{/preview/equipment/return/{id}(id=${e.id})}" th:if="${!e.available}">Return</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
